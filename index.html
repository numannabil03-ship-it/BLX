<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    color: #111827;
}

header {
    background: #07111f;
    color: white;
    padding: 22px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 3px;
}

.tagline {
    color: #9ca3af;
    margin-top: 5px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 18px;
}

.search-box,
.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.search-row {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 15px;
    font-weight: bold;
    background: #2563eb;
    color: white;
}

.search-button {
    padding: 15px 22px;
}

.company {
    background: #07111f;
    color: white;
    padding: 22px;
    border-radius: 16px 16px 0 0;
}

.company-name {
    font-size: 25px;
    font-weight: bold;
}

.company-info {
    color: #9ca3af;
    margin-top: 6px;
}

.score {
    display: inline-block;
    margin-top: 15px;
    background: #16a34a;
    padding: 8px 13px;
    border-radius: 20px;
    font-weight: bold;
}

.metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.metric {
    background: #f8fafc;
    padding: 14px;
    border-radius: 10px;
}

.metric-label {
    color: #6b7280;
    font-size: 12px;
}

.metric-value {
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
}

.controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.control {
    background: white;
    color: #111827;
    border: 1px solid #d1d5db;
}

.control.active {
    background: #2563eb;
    color: white;
}

.chart-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0;
}

.year {
    width: 45px;
    font-size: 12px;
}

.bar-background {
    flex: 1;
    height: 28px;
    background: #e5e7eb;
    border-radius: 6px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: #2563eb;
    border-radius: 6px;
}

.value {
    width: 75px;
    text-align: right;
    font-size: 12px;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: right;
}

th:first-child,
td:first-child {
    text-align: left;
}

.message {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.signal {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 8px;
}

.good {
    background: #ecfdf5;
    color: #166534;
}

.warning {
    background: #fffbeb;
    color: #92400e;
}

footer {
    text-align: center;
    padding: 30px;
    color: #6b7280;
    font-size: 12px;
}

@media (max-width: 600px) {
    .search-row {
        flex-direction: column;
    }

    .search-button {
        width: 100%;
    }

    .metrics {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

    <div class="logo">BLX</div>

/* ============================
   SEARCH FUNCTION
============================ */

function searchCompany() {

    var input =
        document.getElementById("searchInput");

    var result =
        document.getElementById("result");

    var search =
        input.value
        .toLowerCase()
        .trim();

    if (search === "") {

        result.innerHTML =
            '<div class="message">' +
            'Please enter a company name.' +
            '</div>';

        return;
    }

    var company = null;

    var keys = Object.keys(companies);

    for (var i = 0; i < keys.length; i++) {

        var key = keys[i];

        if (
            key === search ||
            companies[key].name
                .toLowerCase()
                .indexOf(search) !== -1
        ) {

            company = companies[key];
            break;
        }
    }

    if (company === null) {

        result.innerHTML =
            '<div class="message">' +
            '<strong>Company not found.</strong>' +
            '<br><br>' +
            'Try Maybank, CIMB, RHB, ' +
            'Public Bank or Bank Islam.' +
            '</div>';

        return;
    }

    showCompany(company);
}

function metric(name,value) {

    return (

        '<div class="metric">' +

            '<div class="metric-label">' +
                name +
            '</div>' +

            '<div class="metric-value">' +
                value +
            '</div>' +

        '</div>'

    );

/* ============================
   HISTORY
============================ */

function showHistory(
    type,
    years,
    clickedButton
) {

    var input =
        document.getElementById("searchInput");

    var search =
        input.value
        .toLowerCase()
        .trim();

    var company = null;

    var keys =
        Object.keys(companies);

    for (
        var i = 0;
        i < keys.length;
        i++
    ) {

        if (
            keys[i] === search ||
            companies[keys[i]].name
                .toLowerCase()
                .indexOf(search) !== -1
        ) {

            company =
                companies[keys[i]];

            break;
        }
    }

    if (!company) {
        return;
    }

    var data;

    var title;

    if (type === "revenue") {
        data = company.revenueHistory;
        title = "Revenue";
    }

    if (type === "profit") {
        data = company.profitHistory;
        title = "Profit After Tax";
    }

    if (type === "assets") {
        data = company.assetHistory;
        title = "Total Assets";
    }

    if (type === "roe") {
        data = company.roeHistory;
        title = "ROE";
    }

    data =
        data.slice(-years);

    var history =
        document.getElementById("history");

    var max = 0;

    for (
        var j = 0;
        j < data.length;
        j++
    ) {

        if (data[j][1] > max) {
            max = data[j][1];
        }
    }

    var html =
        '<h3>' +
        title +
        ' — ' +
        years +
        ' Years' +
        '</h3>' +

        '<div class="controls">' +

            '<button ' +
            'class="control active" ' +
            'onclick="showChart(\'' +
            type +
            '\',' +
            years +
            ')">' +
            '📊 Chart' +
            '</button>' +

            '<button ' +
            'class="control" ' +
            'onclick="showTable(\'' +
            type +
            '\',' +
            years +
            ')">' +
            '📋 Table' +
            '</button>' +

            '<button ' +
            'class="control" ' +
            'onclick="showHistory(\'' +
            type +
            '\',5,null)">' +
            '5 Years' +
            '</button>' +

            '<button ' +
            'class="control" ' +
            'onclick="showHistory(\'' +
            type +
            '\',10,null)">' +
            '10 Years' +
            '</button>' +

        '</div>' +

        '<div id="historyData">';


    for (
        var k = 0;
        k < data.length;
        k++
    ) {

        var width =
            (data[k][1] / max) * 100;

        var displayValue =
            type === "roe"
            ? data[k][1] + "%"
            : "RM " + data[k][1] + "B";

        html +=

            '<div class="chart-row">' +

                '<div class="year">' +
                    data[k][0] +
                '</div>' +

                '<div class="bar-background">' +

                    '<div class="bar" ' +
                    'style="width:' +
                    width +
                    '%"></div>' +

                '</div>' +

                '<div class="value">' +
                    displayValue +
                '</div>' +

            '</div>';
    }

    html += '</div>';

    history.innerHTML = html;
}

============================ */

function showChart(type,years) {

    showHistory(type,years,null);
}

    var data;

        data = company.revenueHistory;
        title = "Revenue";
    }

    if (type === "profit") {
        data = company.profitHistory;
        title = "Profit After Tax";
    }

    if (type === "assets") {
        data = company.assetHistory;
        title = "Total Assets";
    }

    if (type === "roe") {
        data = company.roeHistory;
        title = "ROE";
    }

    data =
        data.slice(-years);

    var html =

        '<h3>' +
        title +
        ' — ' +
        years +
        ' Years' +
        '</h3>' +

        '<div class="controls">' +

            '<button class="control" ' +
            'onclick="showChart(\'' +
            type +
            '\',' +
            years +
            ')">' +
            '📊 Chart' +
            '</button>' +

            '<button class="control active">' +
            '📋 Table' +
            '</button>' +

        '</div>' +

        '<table>' +

            '<tr>' +
                '<th>Year</th>' +
                '<th>Value</th>' +
            '</tr>';


    for (
        var j = 0;
        j < data.length;
        j++
    ) {

        var value =
            type === "roe"
            ? data[j][1] + "%"
            : "RM " + data[j][1] + "B";

        html +=

            '<tr>' +

                '<td>' +
                    data[j][0] +
                '</td>' +

                '<td>' +
                    value +
                '</td>' +

            '</tr>';
    }

    html += '</table>';

    document.getElementById(
        "history"
    ).innerHTML = html;
}

    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchCompany();

            }

        }
    );

</script>
