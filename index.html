<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLX | Financial Research</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f3f6fa;
    color: #111827;
}

header {
    background: #07111f;
    color: white;
    padding: 22px 18px;
}

.header-inner {
    max-width: 900px;
    margin: auto;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
}

.tagline {
    color: #9ca3af;
    margin-top: 4px;
    font-size: 13px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 18px;
}

.search-card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.search-card h1 {
    margin-top: 0;
    font-size: 23px;
}

.search-row {
    display: flex;
    gap: 8px;
}

.search-row input {
    flex: 1;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 11px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    padding: 15px 20px;
    background: #2563eb;
    border: none;
    border-radius: 11px;
    color: white;
    font-size: 16px;
    font-weight: 700;
}

button:active {
    background: #1d4ed8;
}

#result {
    margin-top: 18px;
}

.company-header {
    background: #07111f;
    color: white;
    padding: 22px;
    border-radius: 18px 18px 0 0;
}

.company-name {
    font-size: 25px;
    font-weight: 800;
}

.ticker {
    color: #9ca3af;
    margin-top: 5px;
}

.score {
    margin-top: 18px;
    display: inline-block;
    background: #16a34a;
    padding: 8px 13px;
    border-radius: 20px;
    font-weight: bold;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 0 0 18px 18px;
}

.section-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 12px;
}

.metric {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid #edf0f3;
}

.metric:last-child {
    border-bottom: none;
}

.metric-name {
    color: #6b7280;
}

.metric-value {
    font-weight: 700;
    text-align: right;
}

.green {
    color: #16a34a;
}

.red {
    color: #dc2626;
}

.error {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.hint {
    color: #6b7280;
    font-size: 13px;
    margin-top: 10px;
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
    font-size: 12px;
}

@media (max-width: 500px) {

    .search-row {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .metric {
        font-size: 14px;
    }

}

</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
BLX
</div>

<div class="tagline">
Financial Research Platform
</div>

</div>

</header>


<div class="container">

<div class="search-card">

<h1>Search Malaysian Companies</h1>

<div class="search-row">

<input
id="searchInput"
type="text"
placeholder="Try Maybank, CIMB, RHB..."
onkeydown="handleEnter(event)"
>

<button onclick="searchCompany()">
Search
</button>

</div>

<div class="hint">
Search is not case-sensitive.
</div>

</div>


<div id="result"></div>

</div>


<footer>

BLX Financial Research Platform<br>
Prototype Version

</footer>


<script>

const companies = {

maybank: {

name: "Malayan Banking Berhad",
ticker: "1155",
score: 83,

revenue: "RM 61.2 Billion",
profitBeforeTax: "RM 13.5 Billion",
profitAfterTax: "RM 10.1 Billion",
assets: "RM 1.02 Trillion",
liabilities: "RM 950 Billion",
shares: "12.0 Billion",
roe: "11.8%",
dividendYield: "5.4%"

},

cimb: {

name: "CIMB Group Holdings Berhad",
ticker: "1023",
score: 86,

revenue: "RM 22.4 Billion",
profitBeforeTax: "RM 10.2 Billion",
profitAfterTax: "RM 7.8 Billion",
assets: "RM 750 Billion",
liabilities: "RM 690 Billion",
shares: "10.6 Billion",
roe: "12.6%",
dividendYield: "5.1%"

},

rhb: {

name: "RHB Bank Berhad",
ticker: "1066",
score: 78,

revenue: "RM 16.8 Billion",
profitBeforeTax: "RM 4.1 Billion",
profitAfterTax: "RM 3.1 Billion",
assets: "RM 320 Billion",
liabilities: "RM 295 Billion",
shares: "4.2 Billion",
roe: "10.7%",
dividendYield: "5.8%"

},

"public bank": {

name: "Public Bank Berhad",
ticker: "1295",
score: 89,

revenue: "RM 18.2 Billion",
profitBeforeTax: "RM 8.1 Billion",
profitAfterTax: "RM 6.4 Billion",
assets: "RM 520 Billion",
liabilities: "RM 480 Billion",
shares: "19.4 Billion",
roe: "13.1%",
dividendYield: "3.9%"

},

"bank islam": {

name: "Bank Islam Malaysia Berhad",
ticker: "5258",
score: 75,

revenue: "RM 6.2 Billion",
profitBeforeTax: "RM 1.1 Billion",
profitAfterTax: "RM 0.8 Billion",
assets: "RM 95 Billion",
liabilities: "RM 88 Billion",
shares: "2.2 Billion",
roe: "8.4%",
dividendYield: "3.2%"

}

};


function cleanSearch(value) {

return value
.toLowerCase()
.trim()
.replace(/\s+/g, " ");

}


function searchCompany() {

const input =
document.getElementById("searchInput").value;

const search =
cleanSearch(input);

const result =
document.getElementById("result");


if (search === "") {

result.innerHTML = `

<div class="error">

<strong>Please enter a company name.</strong>

<p>Example: Maybank</p>

</div>

`;

return;

}


let company = companies[search];


if (!company) {

const keys = Object.keys(companies);

const match = keys.find(key =>
key.includes(search) ||
companies[key].name.toLowerCase().includes(search)
);

if (match) {
company = companies[match];
}

}


if (!company) {

result.innerHTML = `

<div class="error">

<strong>Company not found.</strong>

<p>
Try Maybank, CIMB, RHB, Public Bank or Bank Islam.
</p>

</div>

`;

return;

}


result.innerHTML = `

<div class="company-header">

<div class="company-name">

${company.name}

</div>

<div class="ticker">

Bursa Malaysia: ${company.ticker}

</div>

<div class="score">

BLX Score: ${company.score}/100

</div>

</div>


<div class="section">

<div class="section-title">

Financial Overview

</div>


<div class="metric">

<span class="metric-name">
Revenue
</span>

<span class="metric-value">
${company.revenue}
</span>

</div>


<div class="metric">

<span class="metric-name">
Profit Before Tax
</span>

<span class="metric-value">
${company.profitBeforeTax}
</span>

</div>


<div class="metric">

<span class="metric-name">
Profit After Tax
</span>

<span class="metric-value green">
${company.profitAfterTax}
</span>

</div>


<div class="metric">

<span class="metric-name">
Total Assets
</span>

<span class="metric-value">
${company.assets}
</span>

</div>


<div class="metric">

<span class="metric-name">
Total Liabilities
</span>

<span class="metric-value">
${company.liabilities}
</span>

</div>


<div class="metric">

<span class="metric-name">
Number of Shares
</span>

<span class="metric-value">
${company.shares}
</span>

</div>


<div class="metric">

<span class="metric-name">
ROE
</span>

<span class="metric-value">
${company.roe}
</span>

</div>


<div class="metric">

<span class="metric-name">
Dividend Yield
</span>

<span class="metric-value">
${company.dividendYield}
</span>

</div>


</div>

`;

}


function handleEnter(event) {

if (event.key === "Enter") {

searchCompany();

}

}

</script>

</body>
</html>
