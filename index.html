/* =========================

========================= */

* {

body {

button,

/* =========================
   HEADER
========================= */

}

.logo {
    font-size: 32px;
    font-weight: 900;

}

.tagline {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 4px;
}


/* =========================
   MAIN
========================= */

.container {
    max-width: 1050px;
    margin: auto;
    padding: 18px;
}


/* =========================
   SEARCH
========================= */

    background: white;
    padding: 20px;
    border-radius: 18px;

    box-shadow:

        rgba(15,23,42,0.07);
}

.search-title {
    font-size: 23px;
    font-weight: 800;
    margin-bottom: 15px;
}

.search-row {
    display: flex;
    gap: 8px;
}

.search-row input {
    flex: 1;

    padding: 15px;

    border:
        1px solid
        #d1d5db;

    border-radius: 11px;

    font-size: 16px;

    outline: none;
}

.search-row input:focus {
    border-color: #2563eb;
}

.search-button {
    background: #2563eb;
    color: white;

    border: none;

    padding:
        15px 22px;

    border-radius: 11px;

    font-weight: 800;
}


/* =========================
   COMPANY HEADER
========================= */

.company-header {
    margin-top: 20px;

    background:
        linear-gradient(
            135deg,
            #07111f,
            #142b45
        );

    color: white;

    padding: 24px;

    border-radius:
        18px 18px 0 0;
}

.company-name {
    font-size: 27px;
    font-weight: 900;
}

.company-meta {
    margin-top: 6px;

    color: #aab6c5;

    font-size: 14px;
}

.score-row {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 18px;
}

.score {
    background: #16a34a;

    padding:
        8px 14px;

    border-radius: 30px;

    font-weight: 900;
}

.score-label {
    color: #d1d5db;

    font-size: 13px;
}


/* =========================
   SECTIONS
========================= */

.section {
    background: white;

    padding: 20px;

    margin-bottom: 14px;

    box-shadow:
        0 4px 18px
        rgba(15,23,42,0.05);
}

.section-title {
    font-size: 19px;

    font-weight: 900;

    margin-bottom: 15px;
}

.section-description {
    color: #6b7280;

    font-size: 13px;

    margin-top: -8px;

    margin-bottom: 15px;
}


/* =========================
   METRIC CARDS
========================= */

.metrics {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.metric-card {
    background: #f8fafc;

    padding: 15px;

    border-radius: 13px;

    border:
        1px solid
        #edf1f5;
}

.metric-name {
    color: #6b7280;

    font-size: 12px;
}

.metric-value {
    font-size: 18px;

    font-weight: 900;

    margin-top: 6px;
}


/* =========================
   TABS
========================= */

.tabs {
    display: flex;

    gap: 7px;

    margin-bottom: 15px;

    overflow-x: auto;
}

.tab {
    border:
        1px solid
        #d1d5db;

    background: white;

    padding:
        9px 14px;

    border-radius: 9px;

    white-space: nowrap;

    font-size: 13px;

    font-weight: 700;
}

.tab.active {
    background: #2563eb;

    color: white;

    border-color: #2563eb;
}

   CHART / TABLE SWITCH
========================= */

    align-items: center;

    margin-bottom: 15px;

    gap: 10px;

.period-buttons,

   CHART
========================= */

    margin:
        14px 0;

.chart-year {
    width: 48px;

    font-size: 12px;

    color: #6b7280;
}

table {

th,

.score-description {

.signal-yellow {

    border:

        #fde68a;

.signal-red {
    background: #fef2f2;

    border:

        #fecaca;

========================= */

        space-between;

    padding: 13px 0;

    border-bottom:

.holder:last-child {
    border-bottom: none;

.holder-percent {
    font-weight: 800;

/* =========================

========================= */

.news-card {

.news-title {

/* =========================

footer {

    }

        flex-direction: column;

            flex-start;
    }

</style>

</head>

/* =====================================================
   SEARCH
===================================================== */


function cleanSearch(value) {

return value
.toLowerCase()
.trim()
.replace(/\s+/g, " ");

}


function searchCompany() {

const input =
document.getElementById(
"searchInput"
).value;

const search =
cleanSearch(input);

const result =
document.getElementById(
"result"
);


if (!search) {

result.innerHTML = `

<div class="error">

<strong>
Please enter a company name.
</strong>

</div>

`;

return;

}


let company =
companies[search];


if (!company) {

const key =
Object.keys(companies)
.find(key =>

key.includes(search) ||

companies[key]
.name
.toLowerCase()
.includes(search)

);

if (key) {

company =
companies[key];

}

}


if (!company) {

result.innerHTML = `

<div class="error">

<strong>
Company not found.
</strong>

<p>
Try Maybank, CIMB, RHB,
Public Bank or Bank Islam.
</p>

</div>

`;

return;

}


displayCompany(company);

}

let maxValue =
Math.max(
...filtered.map(
x => x[1]
)
);

const year =
item[0];

const value =
item[1];

const width =
(value / maxValue) * 100;

<div class="chart-row">

style="width:${width}%">

<div class="chart-value">

${formatValue(

currentMetric
)}

`;

) {

const titles = {

"Revenue History",

"Profit After Tax History",

"Total Assets History",

};

return titles[metric];

}

) {

return value + "%";

}

return "RM " + value + "B";

}
