<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BLX | Financial Research</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Arial, sans-serif;
    background: #f3f6fa;
    color: #111827;
}

/* HEADER */

header {
    background: #07111f;
    color: white;
    padding: 22px 18px;
}

.header-inner {
    max-width: 950px;
    margin: auto;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
}

.tagline {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 4px;
}

/* MAIN */

.container {
    max-width: 950px;
    margin: auto;
    padding: 18px;
}

/* SEARCH */

.search-card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.search-card h1 {
    margin-top: 0;
    font-size: 23px;
}

.search-row {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 11px;
    font-size: 16px;
}

button {
    padding: 15px 22px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 700;
}

/* COMPANY */

#result {
    margin-top: 20px;
}

.company-header {
    background: #07111f;
    color: white;
    padding: 22px;
    border-radius: 18px 18px 0 0;
}

.company-name {
    font-size: 25px;
    font-weight: 800;
}

.ticker {
    color: #9ca3af;
    margin-top: 5px;
}

.score {
    display: inline-block;
    margin-top: 15px;
    background: #16a34a;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: bold;
}

/* SECTION */

.section {
    background: white;
    padding: 20px;
    margin-bottom: 14px;
    border-radius: 0 0 18px 18px;
}

.section-title {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 15px;
}

/* METRICS */

.metrics {
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap: 12px;
}

.metric-card {
    background: #f8fafc;
    padding: 15px;
    border-radius: 12px;
}

.metric-name {
    color: #6b7280;
    font-size: 13px;
}

.metric-value {
    font-size: 18px;
    font-weight: 800;
    margin-top: 6px;
}

/* CHART */

.chart {
    margin-top: 15px;
}

.chart-row {
    display: flex;
    align-items: center;
    margin: 12px 0;
}

.chart-year {
    width: 50px;
    font-size: 13px;
    color: #6b7280;
}

.bar-container {
    flex: 1;
    background: #e5e7eb;
    height: 28px;
    border-radius: 7px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: #2563eb;
    border-radius: 7px;
}

.bar-profit {
    background: #16a34a;
}

.chart-value {
    width: 80px;
    text-align: right;
    font-size: 13px;
    font-weight: bold;
}

/* SOURCE */

.source {
    background: #f8fafc;
    padding: 15px;
    border-radius: 12px;
    font-size: 13px;
    color: #6b7280;
}

/* ERROR */

.error {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 30px;
    color: #6b7280;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 600px) {

    .search-row {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .metrics {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<div class="logo">
BLX
</div>

<div class="tagline">
Financial Research Platform
</div>

</div>

</header>


<div class="container">


<!-- SEARCH -->

<div class="search-card">

<h1>
Search Company
</h1>

<div class="search-row">

<input
id="searchInput"
type="text"
placeholder="Maybank, CIMB, RHB..."
onkeydown="handleEnter(event)"
>

<button onclick="searchCompany()">
Search
</button>

</div>

</div>


<div id="result"></div>


</div>


<footer>

BLX Financial Research Platform<br>
Prototype Version

</footer>


<script>


/* COMPANY DATABASE */

const companies = {


maybank: {

shares: "12.0B",

roe: "11.8%",

dividendYield: "5.4%",

revenueHistory: [

["2022", 52],
["2023", 55],
["2024", 58],
["2025", 61]

],

profitHistory: [

["2022", 8.2],
["2023", 8.9],
["2024", 9.5],
["2025", 10.1]

]

},


cimb: {

name: "CIMB Group Holdings Berhad",

ticker: "1023",

score: 86,

revenue: "RM 22.4B",

profitBeforeTax: "RM 10.2B",

profitAfterTax: "RM 7.8B",

assets: "RM 750B",

liabilities: "RM 690B",

shares: "10.6B",

roe: "12.6%",

dividendYield: "5.1%",

revenueHistory: [

["2022", 18],
["2023", 19],
["2024", 21],
["2025", 22]

],

profitHistory: [

["2022", 5.6],
["2023", 6.1],
["2024", 7.0],
["2025", 7.8]

]

},


rhb: {

name: "RHB Bank Berhad",

ticker: "1066",

score: 78,

revenue: "RM 16.8B",

profitBeforeTax: "RM 4.1B",

profitAfterTax: "RM 3.1B",

assets: "RM 320B",

liabilities: "RM 295B",

shares: "4.2B",

roe: "10.7%",

dividendYield: "5.8%",

revenueHistory: [

["2022", 13],
["2023", 14],
["2024", 15],
["2025", 16.8]

],

profitHistory: [

["2022", 2.5],
["2023", 2.7],
["2024", 2.9],
["2025", 3.1]

]

},


"public bank": {

name: "Public Bank Berhad",

ticker: "1295",

score: 89,

revenue: "RM 18.2B",

profitBeforeTax: "RM 8.1B",

profitAfterTax: "RM 6.4B",

assets: "RM 520B",

liabilities: "RM 480B",

shares: "19.4B",

roe: "13.1%",

dividendYield: "3.9%",

revenueHistory: [

["2022", 15],
["2023", 16],
["2024", 17],
["2025", 18.2]

],

profitHistory: [

["2022", 5.0],
["2023", 5.4],
["2024", 5.9],
["2025", 6.4]

]

},


"bank islam": {

name: "Bank Islam Malaysia Berhad",

ticker: "5258",

score: 75,

revenue: "RM 6.2B",

profitBeforeTax: "RM 1.1B",

profitAfterTax: "RM 0.8B",

assets: "RM 95B",

liabilities: "RM 88B",

shares: "2.2B",

roe: "8.4%",

dividendYield: "3.2%",

revenueHistory: [

["2022", 4.8],
["2023", 5.2],
["2024", 5.8],
["2025", 6.2]

],

profitHistory: [

["2022", 0.55],
["2023", 0.62],
["2024", 0.71],
["2025", 0.80]

]

}

};


/* SEARCH */

function cleanSearch(value) {

return value
.toLowerCase()
.trim()
.replace(/\s+/g, " ");

}


function searchCompany() {

const input =
document.getElementById("searchInput").value;

const search =
cleanSearch(input);

const result =
document.getElementById("result");


if (!search) {

result.innerHTML = `

<div class="error">

<strong>
Please enter a company name.
</strong>

</div>

`;

return;

}


let company = companies[search];


if (!company) {

const key =
Object.keys(companies).find(key =>

key.includes(search) ||

companies[key].name
.toLowerCase()
.includes(search)

);

if (key) {

company = companies[key];

}

}


if (!company) {

result.innerHTML = `

<div class="error">

<strong>
Company not found.
</strong>

<p>
Try Maybank, CIMB, RHB,
Public Bank or Bank Islam.
</p>

</div>

`;

return;

}


displayCompany(company);

}


/* DISPLAY COMPANY */

function displayCompany(company) {


let revenueHTML = "";

let profitHTML = "";


/* REVENUE CHART */

company.revenueHistory.forEach(item => {

const year = item[0];

const value = item[1];

const width = value / 65 * 100;

revenueHTML += `

<div class="chart-row">

<div class="chart-year">
${year}
</div>

<div class="bar-container">

<div
class="bar"
style="width:${width}%">
</div>

</div>

<div class="chart-value">
RM${value}B
</div>

</div>

`;

});


/* PROFIT CHART */

company.profitHistory.forEach(item => {

const year = item[0];

const value = item[1];

const width = value / 11 * 100;

profitHTML += `

<div class="chart-row">

<div class="chart-year">
${year}
</div>

<div class="bar-container">

<div
class="bar bar-profit"
style="width:${width}%">
</div>

</div>

<div class="chart-value">
RM${value}B
</div>

</div>

`;

});


document.getElementById("result").innerHTML = `


<!-- COMPANY HEADER -->

<div class="company-header">

<div class="company-name">

${company.name}

</div>

<div class="ticker">

Bursa Malaysia:
${company.ticker}

</div>

<div class="score">

BLX Score:
${company.score}/100

</div>

</div>


<!-- FINANCIAL METRICS -->

<div class="section">

<div class="section-title">

Financial Overview

</div>


<div class="metrics">


<div class="metric-card">

<div class="metric-name">
Revenue
</div>

<div class="metric-value">
${company.revenue}
</div>

</div>


<div class="metric-card">

<div class="metric-name">
Profit Before Tax
</div>

<div class="metric-value">
${company.profitBeforeTax}
</div>

</div>


<div class="metric-card">

<div class="metric-name">
Profit After Tax
</div>

<div class="metric-value">
${company.profitAfterTax}
</div>

</div>


<div class="metric-card">

<div class="metric-name">
Total Assets
</div>

<div class="metric-value">
${company.assets}
</div>

</div>


<div class="metric-card">

<div class="metric-name">
Total Liabilities
</div>

<div class="metric-value">
${company.liabilities}
</div>

</div>


<div class="metric-card">

<div class="metric-name">
Number of Shares
</div>

<div class="metric-value">
${company.shares}
</div>

</div>


<div class="metric-card">

<div class="metric-name">
ROE
</div>

<div class="metric-value">
${company.roe}
</div>

</div>


<div class="metric-card">

<div class="metric-name">
Dividend Yield
</div>

<div class="metric-value">
${company.dividendYield}
</div>

</div>


</div>

</div>


<!-- REVENUE CHART -->

<div class="section">

<div class="section-title">

Revenue History

</div>

<div class="chart">

${revenueHTML}

</div>

</div>


<!-- PROFIT CHART -->

<div class="section">

<div class="section-title">

Profit After Tax History

</div>

<div class="chart">

${profitHTML}

</div>

</div>


<!-- SOURCE -->

<div class="section">

<div class="section-title">

Data Source

</div>

<div class="source">

Prototype data for development only.

<br><br>

In the production version,
BLX will display the original
source, publication date and
last updated timestamp for
each financial figure.

</div>

</div>


`;

}


function handleEnter(event) {

if (event.key === "Enter") {

searchCompany();

}

}


</script>

</body>

</html>
